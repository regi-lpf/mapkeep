<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MapKeep</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Tilt+Warp&family=Tilt+Neon&display=swap" rel="stylesheet">
</head>
<body id="login-page-body">
<main class="login-page-container">
  <div class="content-panel login-panel">
    <img src="assets/mapkeep.svg" alt="MapKeep Logo" id="login-logo-large">
    <h1>MAPKEEP</h1>
    <p style="margin-bottom: 20px; font-size: 1.05em; color: var(--color-text-secondary);">
      Registre e reviva suas viagens pelo Brasil
    </p>
    <button id="login-button">
      Entrar com Google <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
    </button>
    <p id="login-feedback" class="login-feedback"></p>
  </div>
</main>
<script type="module" src="js/script.js"></script>
</body>
</html>
